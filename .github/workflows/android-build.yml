name: Build and Release Monthly Split Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/public/app-update.json"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build web app
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://monthlyspliting-otrm.onrender.com
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../monthly-split.apk

      - name: Read app version
        id: app
        run: echo "version=$(node -p "require('./frontend/public/app-update.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish APK GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app.outputs.version }}
          name: Monthly Split v${{ steps.app.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: monthly-split.apk
